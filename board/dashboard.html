<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif&display=swap">
<link rel="stylesheet" href="/assets/board.css">
</head>
<body>
<header class="top">
  <span class="brand">sfactory</span>
  <span class="project" id="project"></span>
  <nav id="tabs" aria-label="Views">
    <button type="button" data-view="board" aria-pressed="true">Board</button>
    <button type="button" data-view="activity" aria-pressed="false">Activity</button>
  </nav>
  <span class="spacer"></span>
  <div class="locks" id="locks" role="group" aria-label="Locks"></div>
  <span class="conn" id="conn">connecting</span>
  <button id="theme" type="button" aria-label="Switch to the light theme">Light</button>
</header>
<div id="demo" role="status">Demo data: nothing here is a real job, and the controls are off.</div>

<main id="board" aria-label="Jobs by stage">
  <section class="col" data-column="Milestones"><h2>Milestones <span class="n"></span></h2><div class="cards"></div></section>
  <section class="col" data-column="Backlog"><h2>Backlog <span class="n"></span></h2><div class="cards"></div></section>
  <section class="col" data-column="Plan"><h2>Plan <span class="n"></span></h2><div class="cards"></div></section>
  <section class="col" data-column="Needs you"><h2>Needs you <span class="n"></span></h2><div class="cards"></div></section>
  <section class="col" data-column="In process"><h2>In process <span class="n"></span></h2><div class="cards"></div></section>
  <section class="col" data-column="Review"><h2>Review <span class="n"></span></h2><div class="cards"></div></section>
  <section class="col" data-column="Fixed"><h2>Fixed <span class="n"></span></h2><div class="cards"></div></section>
  <section class="col" data-column="Pushed / PR"><h2>Pushed / PR <span class="n"></span></h2><div class="cards"></div></section>
  <section class="col" data-column="External running"><h2>External running <span class="n"></span></h2><div class="cards"></div></section>
  <section class="col" data-column="Done"><h2>Done <span class="n"></span></h2><div class="cards"></div></section>
  <section class="col" data-column="Stopped" hidden><h2>Stopped <span class="n"></span></h2><div class="cards"></div></section>
</main>

<section id="activity" aria-label="Activity" hidden>
  <div class="act-running" data-act="running" role="group" aria-label="Running now"></div>
  <p class="act-status" data-act="status" hidden></p>
  <div class="act-split">
    <section class="act-panel act-timeline" aria-labelledby="act-timeline-label">
      <header class="act-ph">
        <h2 class="act-label" id="act-timeline-label">Timeline</h2>
        <div class="act-chips" data-act="chips" role="group" aria-label="Filter the timeline"></div>
      </header>
      <div class="act-feed" data-act="feed"></div>
    </section>
    <section class="act-panel act-output" aria-label="Output">
      <header class="act-oh">
        <div class="act-head" data-act="head"></div>
        <div class="act-seg" data-act="tabs" role="group" aria-label="Output views"></div>
        <button type="button" class="act-follow" data-act="follow" aria-pressed="true"></button>
      </header>
      <div class="act-out" data-act="out" tabindex="0" role="region" aria-label="Agent output"></div>
    </section>
  </div>
</section>

<footer id="footer"></footer>

<aside id="drawer" aria-label="Job files">
  <header><span class="t" id="dtitle"></span><button class="btn" id="dclose" type="button">Close</button></header>
  <div id="files"></div>
  <span class="tag" id="verdict"></span>
  <pre id="content"></pre>
</aside>

<section id="chat" aria-label="Messages to the session" hidden>
  <button type="button" class="chat-toggle" data-chat="toggle" aria-expanded="false" aria-controls="chat-thread">Conversation<span class="chat-new" data-chat="new"></span></button>
  <div class="chat-thread" id="chat-thread" data-chat="thread" role="region" aria-label="Conversation" tabindex="0" hidden></div>
  <p class="chat-sr" data-chat="announce" aria-live="polite"></p>
  <form class="chat-bar" data-chat="form">
    <button type="button" class="chat-scope" data-chat="scope" aria-pressed="false">General</button>
    <label class="chat-sr" for="chat-text">Message to the session</label>
    <textarea id="chat-text" class="chat-input" data-chat="text" rows="1" placeholder="Write to the session" aria-describedby="chat-note"></textarea>
    <button type="submit" class="btn go chat-send" data-chat="send" disabled>Send</button>
    <div class="chat-foot">
      <span class="chat-note" id="chat-note" data-chat="note"></span>
      <span class="chat-count" data-chat="count" hidden></span>
      <span class="chat-chan" data-chat="channel" hidden></span>
    </div>
  </form>
</section>

<script type="module" src="/assets/board.mjs"></script>
</body>
</html>
